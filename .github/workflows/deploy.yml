name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect app directory
        id: dir
        run: |
          if [ -f "lernscroll/package.json" ]; then
            echo "working_dir=lernscroll" >> $GITHUB_OUTPUT
            echo "out_dir=lernscroll/out" >> $GITHUB_OUTPUT
          else
            echo "working_dir=." >> $GITHUB_OUTPUT
            echo "out_dir=out" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ steps.dir.outputs.working_dir }}/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ${{ steps.dir.outputs.working_dir }}
        run: npm ci

      - name: Ensure neural audio clips exist
        working-directory: ${{ steps.dir.outputs.working_dir }}
        run: npm run generate:audio

      - name: Build static export for GitHub Pages
        working-directory: ${{ steps.dir.outputs.working_dir }}
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          rm -rf src/app/api
          npm run build
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dir.outputs.out_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
